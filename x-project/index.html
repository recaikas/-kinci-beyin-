<title>X Project</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<style>
/* Düzen: masaüstünde sabit kabuk — üstte ince çubuk, solda sahne + süren işler, sağda kendi içinde kayan panel.
   Telefonda hepsi alt alta akar. Tek, bilinçli görünüm: gece yarısı CRT'si üstünde şeker renkli pikseller. */
:root {
  --ink: #f3e9ff;
  --ink-2: #b9a8cf;
  --night: #17111f;
  --panel: #221a30;
  --panel-2: #2d2240;
  --line: #43355a;
  --candy: #ff8fc7;
  --mint: #8ff0c4;
  --amber: #ffc85a;
  --blood: #ff5a6e;
  --sky: #8fd3f2;
  --shadow: #0b0810;
  --font-display: 'Silkscreen', 'Courier New', monospace;
  --font-body: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  --font-num: 'VT323', 'Courier New', monospace;
  --s-1: 0.78rem; --s0: 0.92rem; --s1: 1.05rem; --s2: 1.35rem; --s3: 2.4rem;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); font-size: var(--s0); line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.03em; }
h2 { font-size: var(--s1); }
h4 { font-size: var(--s-1); color: var(--ink-2); }
p { margin: 0; }
.num { font-family: var(--font-num); font-size: 1.15em; font-variant-numeric: tabular-nums; }
.neg { color: var(--blood); }
.muted { color: var(--ink-2); }
.small { font-size: var(--s-1); }

/* ---- kabuk */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 10px; padding: 10px 16px 12px; max-width: 1440px; margin: 0 auto; }
#top { display: flex; align-items: center; gap: 16px; padding: 8px 12px; background: var(--panel); border: 2px solid var(--line); box-shadow: 3px 3px 0 var(--shadow); min-width: 0; }
#top .brand { display: grid; min-width: 0; }
#top .brand b { font-family: var(--font-display); font-size: var(--s1); color: var(--candy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top .brand small, .stat small { color: var(--ink-2); font-size: var(--s-1); white-space: nowrap; }
.stars { color: var(--amber); letter-spacing: 1px; }
.stats { display: flex; gap: 18px; margin-left: auto; }
.stat { display: grid; min-width: 70px; }
.stat b { font-size: 1.5rem; line-height: 1.05; }
.kaos { min-width: 110px; }
.kaos.k1 b { color: var(--amber); } .kaos.k2 b { color: #ff9a5a; } .kaos.k3 b { color: var(--blood); animation: shake 0.3s infinite; }
@keyframes shake { 50% { transform: translateX(1px); } }
.time { display: flex; gap: 4px; }
.time button { min-width: 44px; height: 36px; font-size: 1rem; }

main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(360px, 1fr); gap: 12px; min-height: 0; }
.stage { display: grid; grid-template-rows: auto auto 1fr; gap: 8px; min-height: 0; align-content: start; }
#scene { width: 100%; aspect-ratio: 256 / 160; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; border: 4px solid var(--shadow); box-shadow: 5px 5px 0 var(--shadow); display: block; }
#status { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.job { display: grid; gap: 3px; text-align: left; padding: 6px 8px; font-size: var(--s-1); }
.job span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--s0); }
.job small { color: var(--ink-2); }
.job.idle { border-style: dashed; }
.job.hot { border-color: var(--blood); }
.hint { font-size: var(--s-1); color: var(--ink-2); }

.side { display: grid; grid-template-rows: auto 1fr; gap: 8px; min-height: 0; min-width: 0; }
#tabs { display: flex; gap: 4px; flex-wrap: wrap; }
#tabs button { position: relative; padding: 6px 10px; }
#tabs button.on { background: var(--candy); color: var(--night); border-color: var(--candy); }
.badge { position: absolute; top: -7px; right: -7px; background: var(--blood); color: #fff; font-size: 0.65rem; min-width: 18px; padding: 1px 4px; border: 2px solid var(--night); }
#panel { overflow-y: auto; min-height: 0; display: grid; gap: 10px; align-content: start; padding: 2px 6px 12px 2px; scrollbar-color: var(--line) transparent; }

/* ---- bileşenler */
button { background: var(--panel-2); border: 2px solid var(--line); padding: 5px 10px; cursor: pointer; box-shadow: 2px 2px 0 var(--shadow); }
button:hover:not(:disabled) { border-color: var(--candy); }
button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px dashed var(--candy); outline-offset: 2px; }
button.primary { background: var(--candy); color: var(--night); border-color: var(--candy); font-weight: 600; }
button.ghost { background: transparent; box-shadow: none; }
button.danger { color: var(--blood); border-color: color-mix(in srgb, var(--blood) 50%, var(--line)); }
button.danger.on { background: var(--blood); color: var(--night); }
button small { display: block; opacity: 0.75; font-size: 0.72rem; }
button.small { padding: 3px 8px; font-size: var(--s-1); }
input, select { background: var(--panel-2); border: 2px solid var(--line); padding: 5px 7px; width: 100%; min-width: 0; }

.card { background: var(--panel); border: 2px solid var(--line); padding: 12px; display: grid; gap: 10px; box-shadow: 3px 3px 0 var(--shadow); min-width: 0; }
.card .head, details.card > summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
details.card > summary { cursor: pointer; list-style: none; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary h2::before { content: '▸ '; color: var(--candy); }
details.card[open] > summary h2::before { content: '▾ '; }
details.card > .body { display: grid; gap: 8px; }
.pill { display: inline-block; padding: 1px 8px; border: 2px solid var(--line); font-size: var(--s-1); background: var(--panel-2); white-space: nowrap; }
.pill.warn { border-color: var(--amber); color: var(--amber); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.foot > span { margin-right: auto; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.form label { display: grid; gap: 3px; font-size: var(--s-1); color: var(--ink-2); }
.form .wide { grid-column: 1 / -1; }
.picks { border: 0; padding: 0; margin: 0; display: grid; gap: 2px; }
.picks legend { font-size: var(--s-1); color: var(--ink-2); margin-bottom: 4px; }
.pick { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border-bottom: 1px dashed var(--line); cursor: pointer; }
.pick input { width: auto; }
.pick .meta { color: var(--ink-2); font-size: 1rem; }
.pick.locked { opacity: 0.45; cursor: not-allowed; }
.row-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.row-item > div { display: grid; min-width: 0; }
.row-item small { color: var(--ink-2); font-size: var(--s-1); }
.row-item.col { display: grid; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; }
.kv span { color: var(--ink-2); }
.tags { color: var(--ink-2); font-size: var(--s-1); }
.todo { margin: 0; padding-left: 18px; color: var(--amber); }

.bar { display: inline-block; width: 100%; min-width: 40px; height: 9px; background: #120d19; border: 2px solid var(--line); vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--candy); }
.bar.m i { background: var(--mint); } .bar.s i { background: var(--blood); } .bar.prog i { background: var(--sky); }
.bar.kbar { height: 5px; border-width: 1px; } .bar.kbar i { background: linear-gradient(90deg, var(--mint), var(--amber), var(--blood)); }
.bar.d-oyn i { background: #f28fb1; } .bar.d-gfx i { background: #8fd3f2; } .bar.d-ses i { background: #c3a6ff; } .bar.d-tek i { background: #9be59b; }

.progress { display: grid; gap: 3px; font-size: var(--s-1); color: var(--ink-2); }
.split { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; }
.forecast { display: grid; justify-items: center; text-align: center; padding: 6px; border: 2px dashed var(--line); }
.forecast b { font-size: 3rem; line-height: 1; color: var(--candy); }
.forecast small { color: var(--ink-2); font-size: 0.7rem; }
.discs { display: grid; gap: 4px; }
.disc { display: grid; grid-template-columns: 64px 1fr 44px; gap: 6px; align-items: center; font-size: var(--s-1); }
.disc b { text-align: right; }
.phases { display: grid; gap: 6px; }
.phase { padding: 6px 8px; border: 2px solid var(--line); display: grid; gap: 4px; }
.phase.now { border-color: var(--candy); }
details.phase > summary { cursor: pointer; list-style: none; }
details.phase > summary::-webkit-details-marker { display: none; }
.slider { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px; font-size: var(--s-1); }
.slider i { color: var(--candy); font-style: normal; }
.slider input { padding: 0; accent-color: var(--candy); border: 0; background: transparent; }

.room { border-left-width: 6px; }
.r-gelistirme { border-left-color: #8a73b5; } .r-grafik { border-left-color: #8fd3f2; } .r-ses { border-left-color: #c3a6ff; }
.r-qa { border-left-color: #8ff0c4; } .r-arastirma { border-left-color: #ffc85a; } .r-mola { border-left-color: #f28fb1; } .r-donanim { border-left-color: #b0b0c8; }
.mode select { width: auto; }
.people { display: grid; gap: 4px; }
.person { border: 2px solid var(--line); background: var(--panel-2); }
.person.away { border-style: dashed; opacity: 0.75; }
.person.open { border-color: var(--candy); }
.person .who { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name pay" "spec vit"; gap: 2px 8px; padding: 6px 8px; width: 100%; cursor: pointer; }
.person .who:focus-visible { outline: 2px dashed var(--candy); }
.person .name { grid-area: name; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person .pay { grid-area: pay; color: var(--ink-2); }
.person .spec { grid-area: spec; justify-self: start; }
.person .vit { grid-area: vit; display: grid; grid-template-columns: 28px 50px 50px; gap: 4px; align-items: center; }
.person .pill { grid-area: spec; justify-self: end; }
.spec { font-size: 0.72rem; padding: 1px 6px; color: var(--night); font-weight: 600; }
.s-oyn { background: #f28fb1; } .s-gfx { background: #8fd3f2; } .s-ses { background: #c3a6ff; } .s-tek { background: #9be59b; }
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 8px 8px; }
.acts label { display: grid; gap: 2px; font-size: var(--s-1); color: var(--ink-2); }
.acts .btns, .acts p { grid-column: 1 / -1; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--s-1); }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px dashed var(--line); white-space: nowrap; }
th { font-family: var(--font-display); font-weight: 400; color: var(--ink-2); font-size: 0.68rem; }
tr.dim { opacity: 0.55; } tr.tot td { border-top: 2px solid var(--line); }
.charts { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.charts li { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; align-items: baseline; }
.charts small { color: var(--ink-2); } .charts .mine { color: var(--candy); }
.news { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.news li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
.news small { color: var(--ink-2); }
.news .bad span { color: #ffb3bd; } .news .good span { color: var(--mint); } .news .warn span { color: var(--amber); }

#modal { position: fixed; inset: 0; background: rgba(8, 5, 12, 0.8); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dialog { background: var(--panel); border: 3px solid var(--candy); box-shadow: 8px 8px 0 var(--shadow); padding: 18px; max-width: 500px; width: 100%; display: grid; gap: 12px; max-height: 90vh; overflow: auto; animation: pop 0.18s steps(3); }
@keyframes pop { from { transform: scale(0.92); } }
.dialog h2 { font-size: var(--s2); }
.dialog p { font-size: var(--s1); }
.dialog .choices { display: grid; gap: 8px; }
.dialog.setup h1 { font-size: var(--s3); color: var(--candy); text-shadow: 4px 4px 0 var(--shadow); }
.dialog.setup .tag { color: var(--ink-2); }
.dialog.over h2 { font-size: var(--s3); color: var(--blood); }
.dialog hr { border: 0; border-top: 2px dashed var(--line); width: 100%; }
.block { width: 100%; padding: 10px; }

#toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 160%); background: var(--panel); border: 2px solid var(--mint); padding: 8px 14px; z-index: 20; transition: transform 0.2s steps(4); max-width: min(520px, calc(100% - 32px)); box-shadow: 3px 3px 0 var(--shadow); }
#toast { visibility: hidden; } #toast.show { transform: translate(-50%, 0); visibility: visible; } #toast.bad { border-color: var(--blood); }

@media (max-width: 900px) {
  #app { height: auto; min-height: 100%; }
  main { grid-template-columns: minmax(0, 1fr); }
  #panel { overflow: visible; }
  #top { flex-wrap: wrap; gap: 8px 12px; }
  .stats { order: 3; width: 100%; margin-left: 0; justify-content: space-between; gap: 8px; }
  .time { margin-left: auto; }
  .stat { min-width: 0; } .stat b { font-size: 1.25rem; }
  .split { grid-template-columns: 1fr; }
  .acts { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 480px) { .form { grid-template-columns: 1fr; } .acts { grid-template-columns: 1fr; } .slider { grid-template-columns: 96px 1fr; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="app">
  <header id="top"></header>
  <main>
    <div class="stage">
      <canvas id="scene" aria-label="Stüdyonun piksel görünümü"></canvas>
      <div id="status" aria-live="polite"></div>
      <p class="hint">Boşluk: durdur/devam. Kaos arttıkça ofis bozulur.</p>
    </div>
    <div class="side">
      <nav id="tabs" role="tablist" aria-label="Paneller"></nav>
      <div id="panel"></div>
    </div>
  </main>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>

<script type="module">
  import { boot } from './src/ui/ui.js';
  const go = (data) => boot(document.getElementById('app').parentElement, data || {});
  window.claude?.hot?.ready ? window.claude.hot.ready(go) : go(window.claude?.hot?.data ?? {});
</script>
