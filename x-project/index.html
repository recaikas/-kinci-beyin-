<title>X Project</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<style>
/* Düzen: üstte HUD, solda piksel ofis (sahne = oyunun kalbi), sağda yönetim paneli; telefonda alt alta.
   Tek, bilinçli bir görünüm: gece yarısı CRT'si üzerinde şeker renkli pikseller. */
:root {
  --ink: #f3e9ff;        /* metin */
  --ink-2: #b9a8cf;      /* ikincil metin */
  --night: #17111f;      /* zemin */
  --panel: #241a33;      /* kart */
  --panel-2: #2f2342;    /* girdi, iç yüzey */
  --line: #4a3a63;       /* çizgi */
  --candy: #ff8fc7;      /* vurgu (tek cesur renk) */
  --mint: #8ff0c4;       /* iyi */
  --amber: #ffc85a;      /* uyarı */
  --blood: #ff5a6e;      /* kötü */
  --sky: #8fd3f2;
  --font-display: 'Silkscreen', 'Courier New', monospace;
  --font-body: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  --font-num: 'VT323', 'Courier New', monospace;
  --step--1: 0.8rem; --step-0: 0.95rem; --step-1: 1.15rem; --step-2: 1.5rem; --step-3: 2.4rem;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.4; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
.num { font-family: var(--font-num); font-size: 1.15em; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.neg { color: var(--blood); }
.muted { color: var(--ink-2); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.03em; }
h2 { font-size: var(--step-1); }
h3 { font-size: var(--step-0); color: var(--ink-2); margin-block: 0.4rem; }
h4 { font-size: var(--step--1); color: var(--ink-2); }

#app { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; padding: 10px 16px 16px; max-width: 1400px; margin: 0 auto; min-height: 100%; }
#hud { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 14px; background: var(--panel); border: 2px solid var(--line); box-shadow: 4px 4px 0 #0b0810; }
#hud .brand { display: grid; margin-right: auto; }
#hud .brand b { font-family: var(--font-display); font-size: var(--step-1); color: var(--candy); }
#hud small { color: var(--ink-2); font-size: var(--step--1); }
.stat { display: grid; min-width: 86px; }
.stat b { font-size: 1.6rem; line-height: 1; }
.kaos.k1 b { color: var(--amber); } .kaos.k2 b { color: #ff9a5a; } .kaos.k3 b { color: var(--blood); animation: shake 0.3s infinite; }
@keyframes shake { 50% { transform: translateX(1px); } }
.speed { display: flex; gap: 4px; flex-wrap: wrap; }
.speed button { min-width: 38px; }
.speed .on, .crunch.on { background: var(--candy); color: var(--night); border-color: var(--candy); }
.crunch.on { background: var(--blood); border-color: var(--blood); }

#ticker { display: flex; gap: 18px; overflow: hidden; white-space: nowrap; font-size: var(--step--1); color: var(--ink-2); min-height: 1.2em; }
#ticker span { overflow: hidden; text-overflow: ellipsis; }
#ticker .bad { color: var(--blood); } #ticker .good { color: var(--mint); } #ticker .warn { color: var(--amber); }

main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.stage { position: sticky; top: env(safe-area-inset-top, 0px); display: grid; gap: 8px; }
#scene { width: 100%; max-width: 100%; aspect-ratio: 256 / 160; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; border: 4px solid #0b0810; box-shadow: 6px 6px 0 #0b0810; }
.side { display: grid; gap: 10px; min-width: 0; }
#tabs { display: flex; flex-wrap: wrap; gap: 4px; }
#tabs button.on { background: var(--candy); color: var(--night); border-color: var(--candy); }
#panel { display: grid; gap: 10px; min-width: 0; }

button { background: var(--panel-2); border: 2px solid var(--line); padding: 6px 10px; cursor: pointer; box-shadow: 2px 2px 0 #0b0810; font-family: var(--font-body); }
button:hover:not(:disabled) { border-color: var(--candy); }
button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px dashed var(--candy); outline-offset: 2px; }
button.primary { background: var(--candy); color: var(--night); border-color: var(--candy); font-weight: 600; }
button.ghost { background: transparent; box-shadow: none; }
button.danger { color: var(--blood); border-color: color-mix(in srgb, var(--blood) 45%, var(--line)); }
button small { opacity: 0.75; font-size: var(--step--1); }
input, select { background: var(--panel-2); border: 2px solid var(--line); padding: 5px 7px; min-width: 0; width: 100%; }

.card { background: var(--panel); border: 2px solid var(--line); padding: 12px 14px; display: grid; gap: 8px; box-shadow: 4px 4px 0 #0b0810; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.row.wrap { flex-wrap: wrap; justify-content: flex-start; }
.row.end { justify-content: flex-end; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.form label { display: grid; gap: 3px; font-size: var(--step--1); color: var(--ink-2); }
.plats { display: flex; flex-wrap: wrap; gap: 6px; border: 0; padding: 0; margin: 0; }
.plats legend { font-size: var(--step--1); color: var(--ink-2); margin-bottom: 4px; }
.chip { display: flex; gap: 6px; align-items: flex-start; background: var(--panel-2); border: 2px solid var(--line); padding: 5px 8px; cursor: pointer; }
.chip input { width: auto; margin-top: 3px; }
.chip span { display: grid; } .chip small { color: var(--ink-2); font-size: 0.72rem; }
.chip.locked { opacity: 0.5; cursor: not-allowed; }
.pill { display: inline-block; padding: 2px 8px; border: 2px solid var(--line); font-size: var(--step--1); background: var(--panel-2); }
.pill.warn { border-color: var(--amber); color: var(--amber); }

.bar { display: inline-block; width: 100%; min-width: 50px; height: 10px; background: #120d19; border: 2px solid var(--line); vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--candy); }
.bar.m i { background: var(--mint); } .bar.s i { background: var(--blood); } .bar.prog i { background: var(--sky); }
.bar.kbar { height: 6px; border-width: 1px; } .bar.kbar i { background: linear-gradient(90deg, var(--mint), var(--amber), var(--blood)); }
.bar.d-oyn i { background: #f28fb1; } .bar.d-gfx i { background: #8fd3f2; } .bar.d-ses i { background: #c3a6ff; } .bar.d-tek i { background: #9be59b; }
.disc { display: grid; grid-template-columns: 74px 1fr 46px; gap: 6px; align-items: center; }
.disc b { text-align: right; }
.progress { display: grid; gap: 3px; font-size: var(--step--1); color: var(--ink-2); }
.forecast { font-size: var(--step-1); margin: 0; } .forecast b { color: var(--candy); font-size: 1.8rem; } .forecast small { display: block; font-size: var(--step--1); color: var(--ink-2); }
.phases { display: grid; gap: 6px; }
.phase { padding: 6px 8px; border: 2px dashed transparent; }
.phase.now { border-color: var(--candy); }
.slider { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 6px; font-size: var(--step--1); }
.slider i { color: var(--candy); font-style: normal; }
.slider input { padding: 0; accent-color: var(--candy); border: 0; background: transparent; }
.release { border-top: 2px dashed var(--line); padding-top: 8px; display: grid; gap: 8px; }

.person { display: grid; gap: 6px; padding: 8px; background: var(--panel-2); border: 2px solid var(--line); }
.person.away { opacity: 0.7; border-style: dashed; }
.person.applicant { grid-template-columns: 1fr auto; align-items: center; }
.who { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.spec { font-size: 0.72rem; padding: 1px 6px; color: var(--night); font-weight: 600; }
.s-oyn { background: #f28fb1; } .s-gfx { background: #8fd3f2; } .s-ses { background: #c3a6ff; } .s-tek { background: #9be59b; }
.trait { font-size: 0.72rem; color: var(--amber); }
.vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 4px 10px; font-size: var(--step--1); align-items: center; }
.vitals span { display: flex; gap: 6px; align-items: center; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.acts select { width: auto; }
.res, .contract { display: flex; gap: 8px; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.res > div, .contract > div { display: grid; min-width: 0; }
.res small, .contract small { color: var(--ink-2); font-size: var(--step--1); }
.contract.on { display: grid; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px dashed var(--line); white-space: nowrap; }
th { font-family: var(--font-display); font-weight: 400; color: var(--ink-2); font-size: 0.7rem; }
tr.dim { opacity: 0.55; } tr.tot td { border-top: 2px solid var(--line); font-weight: 600; }
td.crit { font-family: var(--font-num); letter-spacing: 0.2em; }
.charts { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 3px; }
.charts li { display: flex; gap: 8px; align-items: baseline; } .charts li small { color: var(--ink-2); margin-left: auto; }
.charts li.mine { color: var(--candy); }
.kv { display: grid; grid-template-columns: auto auto; gap: 4px 18px; justify-content: start; }
.news { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.news li { display: grid; grid-template-columns: 70px 1fr; gap: 8px; }
.news .bad { color: #ffb3bd; } .news .good { color: var(--mint); } .news .warn { color: var(--amber); }

#modal { position: fixed; inset: 0; background: rgba(8, 5, 12, 0.78); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dialog { background: var(--panel); border: 3px solid var(--candy); box-shadow: 8px 8px 0 #0b0810; padding: 18px; max-width: 520px; width: 100%; display: grid; gap: 12px; max-height: 90vh; overflow: auto; animation: pop 0.18s steps(3); }
@keyframes pop { from { transform: scale(0.9); } }
.dialog p { margin: 0; font-size: var(--step-1); }
.dialog .choices { display: grid; gap: 8px; }
.dialog.setup h1 { font-size: var(--step-3); color: var(--candy); text-shadow: 4px 4px 0 #0b0810; }
.dialog.setup .tag { color: var(--ink-2); font-size: var(--step-0); }
.dialog.over h2 { font-size: var(--step-3); color: var(--blood); }
.dialog hr { border: 0; border-top: 2px dashed var(--line); width: 100%; }
.wide { width: 100%; padding: 10px; }

#toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%); background: var(--panel); border: 2px solid var(--mint); padding: 8px 14px; z-index: 20; transition: transform 0.2s steps(4); max-width: calc(100% - 32px); }
#toast.show { transform: translate(-50%, 0); } #toast.bad { border-color: var(--blood); }

@media (max-width: 860px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; }
  .stat { min-width: 70px; } .stat b { font-size: 1.3rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="app">
  <header id="hud" aria-live="polite"></header>
  <div id="ticker" aria-live="polite"></div>
  <main>
    <div class="stage">
      <canvas id="scene" aria-label="Stüdyonun piksel görünümü"></canvas>
      <p class="muted" style="margin:0;font-size:0.8rem">Boşluk tuşu: durdur / devam. Kaos arttıkça ofis bozulur: kâğıtlar, titreyen ışıklar, alarm.</p>
    </div>
    <div class="side">
      <nav id="tabs" aria-label="Paneller"></nav>
      <div id="panel"></div>
    </div>
  </main>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>

<script type="module">
  import { boot } from './src/ui/ui.js';
  const go = (data) => boot(document.getElementById('app').parentElement, data || {});
  window.claude?.hot?.ready ? window.claude.hot.ready(go) : go(window.claude?.hot?.data ?? {});
</script>
