<title>X Project</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<style>
/* Düzen (GDT/Kairosoft): ekranın tamamı ofis sahnesi. Üstte ince HUD (ortada proje sayacı),
   altta ikonlu menü; yönetim sahnenin üstünde açılan pencerelerde. Tek görünüm: gece CRT'si üstünde şeker pikseller. */
:root {
  --ink: #241f35;
  --ink-2: #5e5670;
  --night: #f2dfc0;
  --panel: #fff6e3;
  --panel-2: #f7e7c6;
  --line: #241f35;
  --candy: #3d7be0;
  --mint: #2e9e4f;
  --amber: #b07800;
  --blood: #d9363e;
  --sky: #2f6fd6;
  --shadow: #241f35;
  --bar: #24508f;
  --gold: #ffc83d;
  --c-oyn: #e07a12; --c-gfx: #2f6fd6; --c-ses: #8b3fd9; --c-tek: #0e8f86;
  --font-display: 'Pixelify Sans', 'Trebuchet MS', sans-serif;
  --font-body: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  --font-num: 'VT323', 'Courier New', monospace;
  --s-1: 0.78rem; --s0: 0.92rem; --s1: 1.05rem; --s2: 1.4rem; --s3: 2.6rem;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); font-size: var(--s0); line-height: 1.4; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.03em; }
h2 { font-size: var(--s1); } h3 { font-size: var(--s0); }
p { margin: 0; }
.num { font-family: var(--font-num); font-size: 1.15em; font-variant-numeric: tabular-nums; }
.neg { color: var(--blood); } .muted { color: var(--ink-2); } .small { font-size: var(--s-1); }

/* ---- oyun kabuğu */
#game { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
#hud { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) auto auto; align-items: center; gap: 14px; padding: 8px 16px; background: linear-gradient(var(--panel), #1d1529); border-bottom: 3px solid var(--shadow); }
.brand { display: grid; min-width: 0; }
.brand b { font-family: var(--font-display); color: var(--candy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--s1); }
.brand small, .stat small { color: var(--ink-2); font-size: var(--s-1); white-space: nowrap; }
.stars { color: var(--amber); }
.projslot { min-width: 0; display: grid; }
.proj { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 6px 10px; text-align: left; min-width: 0; }
.proj .pname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj .bar { grid-column: 1 / -1; grid-row: 2; }
.proj .counters { grid-row: 1; grid-column: 2; display: flex; gap: 8px; }
.proj.idle { border-style: dashed; display: grid; grid-template-columns: 1fr; }
.proj.idle small { color: var(--ink-2); }
.c-oyn { color: var(--c-oyn); } .c-gfx { color: var(--c-gfx); } .c-ses { color: var(--c-ses); } .c-tek { color: var(--c-tek); } .c-bug { color: var(--blood); }
.stats { display: flex; gap: 18px; }
.stat { display: grid; }
.stat b { font-size: 1.45rem; line-height: 1.05; }
.kaos { min-width: 104px; }
.kaos.k1 b { color: var(--amber); } .kaos.k2 b { color: #ff9a5a; } .kaos.k3 b { color: var(--blood); animation: shake 0.3s infinite; }
@keyframes shake { 50% { transform: translateX(1px); } }
.time { display: flex; gap: 4px; }
.time button { min-width: 44px; height: 38px; font-size: 1rem; }

#stage { position: relative; min-height: 0; overflow: hidden; background: #0d0915; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
#notes { position: absolute; top: 46px; left: 12px; display: grid; gap: 6px; width: min(340px, calc(100% - 24px)); z-index: 3; pointer-events: none; }
.note { background: var(--panel); border: 2px solid var(--line); border-left-width: 6px; padding: 7px 10px; box-shadow: 3px 3px 0 var(--shadow); font-size: var(--s-1); animation: slide 0.2s steps(3); transition: opacity 0.4s; }
.note.tarih { border-left-color: var(--sky); } .note.good { border-left-color: var(--mint); } .note.bad { border-left-color: var(--blood); } .note.warn { border-left-color: var(--amber); }
.note.out { opacity: 0; }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }

#menu { position: relative; z-index: 9; display: flex; justify-content: center; gap: 6px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(#1d1529, var(--panel)); border-top: 3px solid var(--shadow); overflow-x: auto; }
#menu button { position: relative; display: grid; justify-items: center; gap: 3px; min-width: 76px; padding: 6px 8px 5px; font-size: var(--s-1); }
#menu img { width: 28px; height: 28px; image-rendering: pixelated; }
#menu button.on { background: var(--candy); color: var(--night); border-color: var(--candy); }
#menu button.on img { filter: brightness(0.15); }
.badge { position: absolute; top: -8px; right: -6px; background: var(--blood); color: #fff; font-style: normal; font-size: 0.68rem; min-width: 18px; padding: 1px 4px; border: 2px solid var(--night); }

/* ---- düğmeler ve alanlar */
button { background: var(--panel-2); border: 2px solid var(--line); padding: 5px 10px; cursor: pointer; box-shadow: 2px 2px 0 var(--shadow); }
button:hover:not(:disabled) { border-color: var(--candy); }
button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px dashed var(--candy); outline-offset: 2px; }
button.primary { background: var(--candy); color: var(--night); border-color: var(--candy); font-weight: 600; }
button.big { padding: 9px 18px; font-size: var(--s1); }
button.block { width: 100%; padding: 10px; }
button.ghost { background: transparent; box-shadow: none; }
button.danger { color: var(--blood); border-color: color-mix(in srgb, var(--blood) 50%, var(--line)); }
button.danger.on { background: var(--blood); color: var(--night); }
button.small { padding: 3px 8px; font-size: var(--s-1); }
button small { display: block; opacity: 0.75; font-size: 0.7rem; }
input, select { background: var(--panel-2); border: 2px solid var(--line); padding: 5px 7px; width: 100%; min-width: 0; }

.bar { display: inline-block; width: 100%; min-width: 40px; height: 9px; background: #100b17; border: 2px solid var(--line); vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--candy); }
.bar.m i { background: var(--mint); } .bar.s i { background: var(--blood); } .bar.prog i { background: var(--sky); }
.bar.kbar { height: 5px; border-width: 1px; } .bar.kbar i { background: linear-gradient(90deg, var(--mint), var(--amber), var(--blood)); }
.bar.d-oyn i { background: var(--c-oyn); } .bar.d-gfx i { background: var(--c-gfx); } .bar.d-ses i { background: var(--c-ses); } .bar.d-tek i { background: var(--c-tek); }

/* ---- pencere (menüden açılır) */
#win { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; padding: 70px 16px 96px; background: rgba(10, 6, 18, 0.45); }
.window { width: min(760px, 100%); max-height: 100%; display: grid; grid-template-rows: auto 1fr; background: var(--panel); border: 3px solid var(--candy); box-shadow: 8px 8px 0 var(--shadow); animation: pop 0.16s steps(3); min-height: 0; }
.window > header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 8px 14px; background: var(--candy); color: var(--night); }
.window > header h2 { display: flex; align-items: center; gap: 8px; }
.window > header img { width: 21px; height: 21px; image-rendering: pixelated; filter: brightness(0.15); }
.window > header button { background: var(--night); color: var(--candy); border-color: var(--night); padding: 2px 10px; }
#win-body { overflow-y: auto; padding: 14px; display: grid; gap: 12px; align-content: start; min-height: 0; }
@keyframes pop { from { transform: scale(0.94); } }

.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button.on { background: var(--ink); color: var(--night); border-color: var(--ink); }
.box { border: 2px solid var(--line); background: var(--panel-2); padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.box.hl { border-color: var(--candy); }
details.box > summary { cursor: pointer; list-style: none; }
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary h3::before { content: '▸ '; color: var(--candy); }
details.box[open] > summary h3::before { content: '▾ '; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pill { display: inline-block; padding: 1px 8px; border: 2px solid var(--line); font-size: var(--s-1); background: var(--panel); white-space: nowrap; }
.pill.warn { border-color: var(--amber); color: var(--amber); }
.tier-kolay { border-color: var(--mint); color: var(--mint); } .tier-orta { border-color: var(--amber); color: var(--amber); } .tier-zor { border-color: var(--blood); color: var(--blood); }
.row-item b .pill { margin-left: 6px; font-weight: 400; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.foot > span:first-child, .foot > span:empty { margin-right: auto; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.form label, .field { display: grid; gap: 3px; font-size: var(--s-1); color: var(--ink-2); }
.form .wide { grid-column: 1 / -1; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; }
.kv span { color: var(--ink-2); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.row-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.row-item > div { display: grid; min-width: 0; }
.row-item small { color: var(--ink-2); font-size: var(--s-1); }
.todo { margin: 0; padding-left: 18px; color: var(--amber); display: grid; gap: 4px; }

/* sihirbaz */
.steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; }
.steps li { flex: 1; text-align: center; padding: 5px; border: 2px solid var(--line); font-size: var(--s-1); color: var(--ink-2); }
.steps li.on { border-color: var(--candy); color: var(--ink); background: var(--panel-2); }
.steps li.done { color: var(--mint); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.tile { position: relative; text-align: left; padding: 7px 9px; min-height: 38px; }
.tile.on { background: var(--ink); color: var(--night); border-color: var(--ink); }
.tile em { position: absolute; top: -7px; right: -4px; font-style: normal; font-size: 0.62rem; background: var(--amber); color: var(--night); padding: 0 4px; }
.picks { border: 0; padding: 0; margin: 0; display: grid; gap: 2px; }
.picks legend { font-size: var(--s-1); color: var(--ink-2); margin-bottom: 4px; }
.pick { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px; border-bottom: 1px dashed var(--line); cursor: pointer; }
.pick input { width: auto; }
.pick .meta { color: var(--ink-2); font-size: 1rem; }
.pick.locked { opacity: 0.45; cursor: not-allowed; }
.summary { display: grid; gap: 10px; padding: 14px; border: 2px dashed var(--candy); }
.summary h2 { font-size: var(--s2); color: var(--candy); }

/* proje */
.proj-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.forecast { display: grid; justify-items: center; padding: 4px 12px; border: 2px dashed var(--line); }
.forecast b { font-size: 2.6rem; line-height: 1; color: var(--candy); }
.forecast small { color: var(--ink-2); font-size: 0.68rem; }
.progress { display: grid; gap: 3px; font-size: var(--s-1); color: var(--ink-2); }
.disc { display: grid; grid-template-columns: 70px 1fr 46px; gap: 6px; align-items: center; font-size: var(--s-1); }
.disc b { text-align: right; }

/* bina geçişi ve bilgisayar menüsü */
#bnav { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; z-index: 3; }
#bnav button { min-width: 34px; height: 30px; padding: 0 8px; }
.bname { display: grid; justify-items: center; padding: 3px 12px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 2px solid var(--line); font-family: var(--font-display); font-size: var(--s-1); white-space: nowrap; }
.bname small { display: flex; gap: 4px; margin-top: 2px; }
.bname i { width: 6px; height: 6px; background: var(--line); } .bname i.on { background: var(--candy); }
#scene { cursor: pointer; touch-action: pan-y; }
.hub { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.hubtile { display: grid; justify-items: start; gap: 4px; padding: 12px; text-align: left; min-height: 92px; }
.hubtile img { width: 28px; height: 28px; image-rendering: pixelated; }
.hubtile small { color: var(--ink-2); font-size: var(--s-1); }
/* Konu H: Kairosoft açılır menüsü */
#kpop { position: fixed; left: 10px; top: 70px; z-index: 9; max-width: calc(100vw - 20px); max-height: calc(100vh - 160px); overflow: auto; background: var(--panel); border: 3px solid var(--candy); box-shadow: 4px 4px 0 var(--shadow); }
#kpop .khead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; background: var(--candy); color: var(--night); font-family: var(--font-display); font-size: var(--s-1); }
#kpop .kx { min-height: 26px; padding: 0 8px; }
#kpop .kcols { display: flex; align-items: flex-start; }
#kpop .kcol { display: grid; gap: 4px; padding: 6px; min-width: 170px; }
#kpop .kcol.sub { border-left: 2px solid var(--line); background: var(--panel-2); min-width: 190px; }
#kpop .krow { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; min-height: 40px; }
#kpop .krow img { width: 20px; height: 20px; image-rendering: pixelated; }
#kpop .krow small { color: var(--ink-2); font-size: 0.7rem; }
#kpop .krow.on { background: var(--mint); color: var(--night); border-color: var(--mint); }
#kpop .krow.on small { color: var(--night); }
#kpop .krow.tease { opacity: 0.5; border-style: dashed; }
#kpop .krow .newtag { top: -6px; right: -4px; }
#kpop .kcard { margin: 6px; padding: 6px 8px; border: 2px dashed var(--line); display: grid; gap: 3px; max-width: 360px; }
#kpop .kc-head { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
#kpop .kc-say { margin: 0; font-style: italic; font-size: var(--s-1); }
#kpop .kc-bars { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 6px; align-items: center; font-size: 0.7rem; }
#kpop .kpad { margin: 4px 10px; }
@media (max-width: 600px) { #kpop { left: 6px; top: 96px; max-height: calc(100vh - 190px); } #kpop .kcol { min-width: 140px; } #kpop .kcol.sub { min-width: 150px; } }
.hubtile { position: relative; }
.hubtile .mi-ic { font-size: 1.5rem; line-height: 1; }
.hubtile.tease, .tile.tease { opacity: 0.5; border-style: dashed; }
.hubtile.tease .mi-ic { font-family: var(--font-display); color: var(--ink-2); }
.newtag, .badge.new { position: absolute; top: -8px; right: -6px; font-style: normal; font-size: 0.62rem; background: var(--amber); color: var(--night); padding: 1px 4px; border: 2px solid var(--night); }
.firstnote { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; padding: 6px 10px; border: 2px dashed var(--sky); font-size: var(--s-1); }
.window > header .back { margin-right: 6px; padding: 0 8px; }
.plist-r { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: var(--s-1); }
.plist-r .good { color: var(--mint); } .plist-r .bad { color: #ffb3bd; } .plist-r .quote { color: var(--ink-2); font-style: italic; list-style: none; margin-left: -18px; }
.slider .kn { margin-left: 4px; }

/* MGT tarzı yan satış paneli (sahnenin sağ kenarı): oyun başına maliyet, gelir, kâr ve kâr eğrisi */
#market { position: absolute; right: 8px; top: 8px; bottom: 8px; width: 232px; display: flex; flex-direction: column; gap: 6px; z-index: 3; pointer-events: none; }
#market > * { pointer-events: auto; }
#market.closed { bottom: auto; width: auto; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 10px; background: color-mix(in srgb, var(--panel) 94%, transparent); font-size: var(--s-1); }
.phead i { font-style: normal; color: var(--ink-2); }
.plist-m { display: grid; gap: 6px; overflow-y: auto; min-height: 0; padding-right: 2px; align-content: start; scrollbar-width: thin; }
.mcard { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 0 6px; align-items: center; padding: 6px 8px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 2px solid var(--line); box-shadow: 3px 3px 0 var(--shadow); }
.mcard.dev { cursor: default; border-style: dashed; }
.mcard:hover, .mcard:focus-visible { border-color: var(--candy); }
.mcard .rk { font-family: var(--font-num); font-size: 1.45rem; line-height: 1; color: var(--amber); min-width: 30px; }
.mcard .rk.top { color: var(--candy); }
.mcard .rk.off, .proj.sale .rk.off { color: var(--ink-2); font-size: 1.1rem; }
.mcard .lsub { grid-column: 1 / -1; font-size: 0.72rem; color: var(--ink-2); line-height: 1.25; margin: 1px 0 3px; }
.mcard .nm { font-size: var(--s-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcard .wk { font-family: var(--font-num); font-size: 0.95rem; color: var(--ink-2); white-space: nowrap; }
.mcard .wk i { font-style: normal; margin-left: 3px; }
.mcard .row { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 6px; font-size: var(--s-1); line-height: 1.25; }
.mcard .row small { color: var(--ink-2); }
.mcard svg { grid-column: 1 / -1; width: 100%; height: 22px; display: block; margin-top: 3px; }
.mcard svg .zero { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 2; vector-effect: non-scaling-stroke; }
.mcard svg polyline { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
.mcard svg .pos { stroke: var(--mint); } .mcard svg .neg { stroke: var(--blood); }
.pos { color: var(--mint); }
.skills { display: grid; grid-template-columns: 100px 1fr 30px; gap: 2px 6px; align-items: center; font-size: var(--s-1); margin: 6px 0; }
.skills b { text-align: right; }
.bar.sk i { background: var(--sky); }
.traits { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.rels { margin: 2px 0; } .rels span { margin-right: 8px; }
.tiles.dz .tile { display: grid; gap: 2px; text-align: left; }
.tiles.dz .sw { display: block; width: 100%; height: 10px; border-top: 4px solid; }
h3.sub { margin: 10px 0 4px; font-size: var(--s-1); color: var(--ink-2); }
.news li.tarih span::before { content: '📰 '; }
.board .bar { margin: 3px 0; }
.up { color: var(--mint); } .down { color: var(--blood); } .new { color: var(--amber); }
.proj.sale { border-style: solid; border-color: var(--sky); }
.proj.sale .rk { font-family: var(--font-num); color: var(--amber); }
.toplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.toplist li { display: grid; grid-template-columns: 34px 46px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border-bottom: 1px dashed var(--line); }
.toplist li.mine { background: color-mix(in srgb, var(--candy) 14%, transparent); }
.toplist .r { font-family: var(--font-num); font-size: 1.4rem; color: var(--amber); text-align: right; }
.toplist small { color: var(--ink-2); display: block; }
.toplist li.filler { opacity: 0.62; }
.toplist li.gap { border-bottom: 0; }
.toplist li > i { font-style: normal; color: var(--ink-2); font-size: var(--s-1); }
.ltabs { margin-bottom: 6px; }
.ltabs button { min-height: 32px; padding: 4px 10px; font-size: var(--s-1); }
.ltabs button.on { background: var(--candy); color: var(--night); border-color: var(--candy); }
/* Bölgeler (Konu C) */
.wmap { width: 100%; max-width: 760px; height: auto; aspect-ratio: 100 / 72; display: block; margin: 4px auto; background: color-mix(in srgb, var(--sky) 10%, var(--panel)); border: 2px solid var(--line); }
.wmap rect { fill: var(--line); stroke: var(--shadow); stroke-width: 0.4; }
.wmap text { font-size: 2.3px; fill: var(--ink); font-family: var(--font-body); }
