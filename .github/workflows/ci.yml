name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KZ_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Edge Function paketleri güncel mi
        run: npm run bundle:functions && git diff --exit-code supabase/functions/dist
      - name: Web derlemesi
        run: npm run build
      - name: Playwright (yerel mod, uçtan uca)
        run: npx playwright install --with-deps chromium && npm run e2e
        env:
          PW_CHROMIUM: ""
