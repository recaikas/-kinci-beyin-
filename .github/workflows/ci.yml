name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KZ_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: seed.sql güncel mi
        run: npm run gen:seed && git diff --exit-code supabase/seed.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function tip kontrolü
        working-directory: supabase/functions/turn
        run: deno check index.ts && deno lint index.ts
